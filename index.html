<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Starbucks</title>
</head>
<body>
    <div class="navbar">
       <div class="nav-left">
        <img src="logo.png" alt="main logo">
        <ul class="nav-list">
            <li><a href="#">MENU</a></li>
            <li><a href="#">REWARDS</a></li>
            <li><a href="#">GIFT CARDS</a></li>
        </ul>
       </div>
       <div class="nav-right">
          <a href="#" class="find-store">Find a store</a>
        <button class="btn-sign">Sign in</button>
        <button class="btn-join">Join now</button>
       </div>
    </div>

    <section class="hero-section">
    <div class="hero-content">
        <div class="hero-text">
            <h2>Bring on the merry</h2>
            <p>Festive flavors of spiced gingerbread, rich caramel and sweet peppermint are here to make every moment merrier.</p>
            <a href="#" class="btn-primary">Order a seasonal treat</a>
        </div>
        <div class="hero-image">
            <img src="holiday-drinks.jpg" alt="Holiday Drinks">
        </div>
    </div>
</section>
    
</body>
</html>
